pvc:
  name: immich-pvc
  storageClass: local-path
  storage: 50Gi

cert:
  name: immich-cert
  secretName: immich-cert-secret
  dnsNames:
    - immich.sylvanc.xyz

immich:
  immich:
    metrics:
      enabled: false
    persistence:
      library:
        existingClaim: immich-pvc
    configuration:
      trash:
        enabled: false
        days: 30
      storageTemplate:
        enabled: true
        template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
    # Sets the resource Kind to store configuration in. Must be either ConfigMap or Secret.
    configurationKind: ConfigMap

  server:
    enabled: true
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: "v3"
              pullPolicy: IfNotPresent
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
    
    ingress:
      main:
        enabled: false
        annotations:
          # proxy-body-size is set to 0 to remove the body limit on file uploads
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: immich.sylvanc.xyz
            paths:
              - path: "/"
                service:
                  identifier: main
        tls:
          - secretName: immich-cert-secret
            hosts:
              - immich.sylvanc.xyz

  valkey:
    enabled: true
